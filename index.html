<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Tailwind (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ["'Instrument Serif'", "serif"],
          body: ["'Barlow'", "sans-serif"],
        },
        borderRadius: {
          DEFAULT: "9999px",
        },
      },
    },

</script>

<!-- React / Babel / Framer Motion -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script>
  /* framer-motion's UMD bundle registers itself as `Motion` in some builds and
     `FramerMotion` in others — keep whichever one actually landed. */
  window.Motion = window.FramerMotion || window.Motion;
</script>

<style>
  /* ---------- Liquid glass design system ---------- */
  .liquid-glass {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.45) 0%,
      rgba(255, 255, 255, 0.15) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.15) 80%,
      rgba(255, 255, 255, 0.45) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .liquid-glass-strong {
    background: rgba(255, 255, 255, 0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(50px);
    -webkit-backdrop-filter: blur(50px);
    border: none;
    box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.2) 20%,
      rgba(255, 255, 255, 0) 40%,
      rgba(255, 255, 255, 0) 60%,
      rgba(255, 255, 255, 0.2) 80%,
      rgba(255, 255, 255, 0.5) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* ---------- Base ---------- */
  html { scroll-behavior: smooth; }
  body {
    background: #000;
    color: #fff;
    font-family: "Barlow", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(255, 255, 255, 0.85); color: #000; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

  /* ---------- Form controls ---------- */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  input::placeholder { color: rgba(255, 255, 255, 0.35); }

  select.glass-select option { background: #0a0a0a; color: #fff; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 9999px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Loading shim shown until React paints */
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 100;
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 2rem;
    color: rgba(255, 255, 255, 0.35);
    transition: opacity 0.4s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body class="bg-black">
  <div id="boot">a</div>
  <div id="root"></div>

  <!-- Plain helpers (no JSX) -->
  <script src="js/runtime.js"></script>
  <script src="js/calc/engine.js"></script>

  <!-- Components (JSX, compiled in-browser by Babel standalone) -->
  <script type="text/babel" data-presets="react" src="js/icons.js"></script>
  <script type="text/babel" data-presets="react" src="js/FadingVideo.js"></script>
  <script type="text/babel" data-presets="react" src="js/BlurText.js"></script>
  <script type="text/babel" data-presets="react" src="js/sections/Navbar.js"></script>
  <script type="text/babel" data-presets="react" src="js/sections/Hero.js"></script>
  <script type="text/babel" data-presets="react" src="js/sections/Capabilities.js"></script>
  <script type="text/babel" data-presets="react" src="js/calc/controls.js"></script>
  <script type="text/babel" data-presets="react" src="js/calc/Results.js"></script>
  <script type="text/babel" data-presets="react" src="js/sections/Calculator.js"></script>
  <script type="text/babel" data-presets="react" src="js/sections/Footer.js"></script>
  <script type="text/babel" data-presets="react" src="js/App.js"></script>
</body>
</html>
